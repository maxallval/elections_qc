<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Élections Québec 2026 – Résultats en direct</title>
<script src="config.js"></script>
<style>
:root{--bg:#f4f6f9;--ink:#18202b;--mute:#667085;--line:#dde1e7;--none:#d9dde4;--card:#fff;--cardA:#ffffffe6;--bar:#e8ecf1;--stroke:#fff;--panel:#fff;--accent:#7c5cff}
[data-theme=dark]{--panel:#121821;--bg:#0d1117;--ink:#e6edf3;--mute:#8b949e;--line:#232a33;--none:#252b34;--card:#161b22;--cardA:#161b22e6;--bar:#262d36;--stroke:#0d1117;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.4 Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;overflow:hidden}
a{color:inherit}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:0;border-radius:0;padding:6px 12px;cursor:pointer}
button.on{background:#7c5cff44;box-shadow:inset 0 -2px 0 var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);flex-wrap:wrap}
.hl{display:flex;align-items:baseline;gap:14px;min-width:0;flex-wrap:wrap}
h1{font-size:17px;margin:0;white-space:nowrap}
#status{color:var(--mute);font-size:13px}
#status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:0;background:#e3a008;margin-right:8px}
#status[data-s=ok]::before{background:#2fb86b}
#tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#upd{color:var(--mute);font-size:12px}
main{display:grid;grid-template-columns:minmax(0,1fr) 426px;min-height:0}
#left{display:flex;flex-direction:column;min-width:0;min-height:0}
#bar{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;flex-wrap:wrap;align-items:center}
#zones,#rbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#seg{display:flex}#seg nav{display:flex}
#seg button{margin-left:2px}
#seg nav button:first-child{margin-left:0}
#seg>button:last-child{border-radius:0}
#pf{font-size:13px;color:var(--mute);display:flex;gap:4px;align-items:center}
#pf[hidden]{display:none}
#map{position:relative;flex:1;min-height:0;padding:4px 12px 44px}
#maps{display:flex;gap:12px;height:100%}
.mp{position:relative;flex:1;min-width:0;height:100%}
.mp[hidden]{display:none}
.cap{position:absolute;top:2px;left:4px;font-size:12px;font-weight:600;background:var(--cardA);padding:1px 8px;border-radius:0;z-index:3}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.drag{cursor:grabbing}
path{stroke:var(--stroke);stroke-width:calc(var(--u,.01)*.6px);cursor:pointer}
path:hover,path.hl{stroke:var(--ink);stroke-width:calc(var(--u,.01)*2px)}
#pen{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#zoom{position:absolute;right:20px;bottom:56px;display:flex;flex-direction:column;gap:4px;z-index:6}
#zoom button{width:34px;height:34px;font-size:18px;padding:0}
#legend{position:absolute;left:14px;bottom:8px;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);background:var(--cardA);padding:6px 12px;border:0;border-radius:0;z-index:5}
#legend i{display:inline-block;width:10px;height:10px;border-radius:0;margin-right:5px;vertical-align:-1px}
aside{background:var(--panel);overflow:auto;padding:14px 16px;min-height:0}
aside h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px;font-weight:600}
aside h2:first-of-type{margin-top:14px}
.srch{position:relative}
#q{width:100%;padding:9px 12px;border-radius:0;border:0;background:var(--card);color:var(--ink);font:inherit}
#qr{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:0;border-radius:0;z-index:20;max-height:260px;overflow:auto}
#qr div{padding:8px 12px;cursor:pointer}#qr div:hover{background:#7c5cff22}
.sub{color:var(--mute);font-size:13px;margin-bottom:10px}
#filters .fr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
#filters button{border-radius:0;padding:4px 11px;font-weight:600}
#filters button small{opacity:.65;font-weight:500;margin-left:4px}
#filters #fx{color:var(--mute);font-weight:500}
#filters .l{color:var(--mute);font-size:12px}
.sr{display:grid;grid-template-columns:44px 1fr 34px 36px;gap:8px;align-items:center;margin:7px 0}
.sr b{font-size:13px}.sr .n{text-align:right;font-weight:700}.sr .d{color:var(--mute);text-align:right;font-size:12px}
.bar{height:10px;background:var(--bar);border-radius:0;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;height:100%}
.bar u{position:absolute;top:0;height:100%;border-left:2px dotted var(--ink);opacity:.7}
.dn{font-size:20px;font-weight:700}
.d22{background:var(--card);border:0;border-radius:0;padding:8px 10px;margin:8px 0;font-size:13px}
.cl{list-style:none;margin:8px 0;padding:0}
.tier{border-top:1px solid var(--line);padding:8px 0}
.tier summary{cursor:pointer;list-style:none}
.tier summary::-webkit-details-marker{display:none}
.tier summary::before{content:"▸ ";color:var(--mute)}
.tier[open] summary::before{content:"▾ "}
.tier summary span{color:var(--mute);font-size:13px}
.chips{margin:4px 0 2px 14px;font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.pv{padding:8px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.pv b{font-size:14px}.pv span{color:var(--mute)}
#tip{position:fixed;pointer-events:none;background:var(--card);border:0;border-radius:0;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.35);font-size:13px;min-width:240px;display:none;z-index:30}
#tip b{font-size:14px}
#tip .c{display:flex;justify-content:space-between;gap:12px;margin-top:4px}
#tip .c.w{font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:0;margin-right:6px}
/* bandeau du bas */
#banner{background:var(--panel);padding:8px 14px 10px}
#banner .bl{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#banner .rs{display:inline-block;width:12px;height:12px;background:#e02424}
#banner .bl b{background:#fff;color:#0d1117;padding:3px 14px;font-size:17px;text-transform:uppercase;letter-spacing:.02em}
#banner .br{display:grid;grid-template-columns:150px repeat(5,minmax(0,1fr));gap:8px;align-items:end}
#banner .bbox{background:var(--card);padding:8px 10px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.05em}
#banner .bbox strong{display:block;font-size:26px;letter-spacing:0}
#banner .bbox span{display:block;color:var(--mute);font-weight:500}
#banner .bpct{text-align:right;font-size:12px;color:var(--mute);border-bottom:3px solid var(--c);margin-bottom:4px}
#banner .bblock{background:var(--c);color:#fff;display:flex;align-items:center;padding:0 14px;height:62px;position:relative}
#banner .bblock b{position:absolute;top:0;left:0;background:#0d1117;padding:1px 10px;font-size:15px}
#banner .bblock em{font-style:normal;font-size:42px;font-weight:700;margin-left:auto}
body.bandeau{display:block;height:auto;overflow:visible}
body.bandeau>*:not(#banner){display:none!important}
body.bandeau.transparent{background:transparent}
body.bandeau.transparent #banner{background:#0d1117cc}

/* surveillances, régions, alertes, badge */
#wchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.wc{border-left:4px solid var(--c);border-radius:0}.wc small{opacity:.7;margin-left:4px}
.wc.on{background:color-mix(in srgb,var(--c) 28%,transparent)}
.fr{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.fr button{padding:4px 10px}
#wlist .pv{cursor:pointer}
.mz{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:6px}
.mz div{border-radius:0;padding:6px 8px;font-size:12px;line-height:1.2;min-height:46px;cursor:pointer;background:var(--card);border:0;border-left:5px solid var(--c,var(--none))}
.mz div small{display:block;color:var(--mute)}
.bd{display:inline-block;margin-left:6px;padding:0 7px;border-radius:0;font-size:11px;border:1px solid var(--accent);color:var(--ink);background:#7c5cff22}
.rg{border-top:1px solid var(--line);padding:8px 0;cursor:pointer}
.rg:hover{background:#7c5cff10}
.rg .rn{display:flex;justify-content:space-between;gap:8px}.rg .rn span{color:var(--mute);font-size:12px}
.stack{display:flex;height:10px;border-radius:0;overflow:hidden;background:var(--bar);margin:6px 0 4px}
.stack i{display:block;height:100%}
.rg .rc{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.rg .rc em{font-style:normal;margin-right:8px}
#toasts{position:fixed;right:16px;bottom:170px;z-index:40;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--card);border:0;border-left:5px solid var(--accent);border-radius:0;padding:9px 12px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer}
.toast.majL,.toast.majW{border-left-color:#2fb86b;font-size:14px}
.toast.more{border-left-color:var(--mute)}
dialog{background:var(--card);color:var(--ink);border:0;border-radius:0;padding:14px;width:min(460px,92vw)}
dialog::backdrop{background:#0009}
dialog .dh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
#wdq{width:100%;padding:8px 10px;border-radius:0;border:0;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
#wdl{max-height:50vh;overflow:auto}
#wdl label{display:flex;gap:8px;padding:4px 2px;cursor:pointer}
path.sel{stroke:#fff;stroke-width:calc(var(--u,.01)*3px)}
#gl path{fill:none;stroke:var(--g);stroke-linejoin:round;pointer-events:none}
#gl .gw{stroke-width:calc(var(--u,.01)*9px);stroke-opacity:.28}
svg.moving #gl{display:none}
#gl .gn{stroke-width:calc(var(--u,.01)*2.2px)}
path.pulse{animation:pls 1.3s ease-out 3}
@keyframes pls{0%{stroke:#fff;stroke-width:calc(var(--u,.01)*2px)}50%{stroke:#fff;stroke-width:calc(var(--u,.01)*7px)}100%{stroke-width:calc(var(--u,.01)*.6px)}}
@media(prefers-reduced-motion:reduce){path.pulse{animation:none;stroke:#fff;stroke-width:calc(var(--u,.01)*4px)}}
button:hover{background:color-mix(in srgb,var(--ink) 10%,var(--card))}
button.on:hover{background:#7c5cff55}
.dot,#status::before{border-radius:50%}
#mosaic{position:absolute;left:12px;right:12px;top:4px;max-height:calc(100% - 48px);z-index:7;background:var(--cardA);padding:12px 14px;overflow:auto}
#mosaic[hidden]{display:none}
#mosaic .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
#mosaic .mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
#mosaic .mt{padding:8px 10px;background:color-mix(in srgb,var(--c,var(--none)) 22%,var(--card));border-left:5px solid var(--c,var(--none));cursor:pointer;min-height:66px}
#mosaic .mt:hover{background:color-mix(in srgb,var(--c,var(--none)) 38%,var(--card))}
#mosaic .mt.sel{box-shadow:inset 0 0 0 2px #fff}
#mosaic .mt b{display:block;font-size:14px}
#mosaic .mt small{display:block;color:var(--mute)}
.cl li{border-left:4px solid var(--c);padding:4px 8px 4px 10px;margin:6px 0;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.cl li small{display:block;color:var(--mute)}.cl li .v{text-align:right;font-size:13px}
.av{position:relative;display:inline-grid;place-items:center;flex:none;width:40px;height:40px;background:var(--c);color:#fff;font-weight:700;font-size:14px;overflow:hidden;box-shadow:inset 0 -3px 0 #0006}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av i{font-style:normal}
#mosaic .mh .big{font-size:30px;font-weight:700;margin-right:10px}
#mosaic .mgc{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
#mosaic .mc{background:var(--card);padding:10px 12px;cursor:pointer}
#mosaic .mc:hover{background:color-mix(in srgb,var(--ink) 8%,var(--card))}
#mosaic .mc.sel{box-shadow:inset 0 0 0 2px #fff}
#mosaic .mc>b{font-size:16px}
#mosaic .ms{color:var(--mute);font-size:12px;margin:2px 0 8px}
#mosaic .mr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:6px 0}
#mosaic .mr small{display:block;color:var(--mute)}
#mosaic .mr .mv{font-weight:700;min-width:46px;text-align:right}
#mosaic .mr .mb{grid-column:2/4;height:4px;background:var(--bar);margin-top:-4px}
#mosaic .mr .mb i{display:block;height:100%}
#mosaic .mr.lead b{color:var(--ink)}
aside{display:flex;flex-direction:column}
.blk{flex:none}.blk[hidden]{display:none}
.hh{display:flex;align-items:center;gap:8px;margin:20px 0 8px}
.hh h2{margin:0!important}
#b-search{margin-bottom:2px}
.ib{width:26px;height:26px;padding:0;font-size:15px;line-height:1;min-height:0;background:transparent;color:var(--mute)}
.ib:hover{color:var(--ink)}
#parties{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pc{background:var(--card);border-top:3px solid var(--c);padding:6px 2px;text-align:center;display:flex;flex-direction:column;line-height:1.15}
.pc b{font-size:12px;color:var(--c)}.pc .n{font-size:26px;font-weight:700}.pc .d{font-size:11px;color:var(--mute)}
.sbar{grid-column:1/-1;display:flex;height:10px;background:var(--bar);position:relative;margin-top:6px}
.sbar i{display:block;height:100%}
.sbar u{position:absolute;top:-3px;height:16px;border-left:2px dotted var(--ink)}
#wchips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.wc{padding:6px 2px;text-align:center;font-size:12px}
#filters .fr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 8px}
#filters button{padding:6px 2px;font-size:12px;text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1.25}
#filters button small{margin-left:0}
#filters #fx{grid-column:1/-1}
#tools .ic{margin-right:6px}
#hdb{line-height:1.55;font-size:14px;padding:4px 0}
/* segments du panneau de droite */
:root{--seg:#f4f6f9;--segh:#e3e8ef}
[data-theme=dark]{--seg:#1c2430;--segh:#2a3545}
aside{padding:12px}
#b-search{margin-bottom:12px}
.blk:not(#b-search){background:var(--seg);margin:0 0 12px;padding:0 12px 12px}
.blk:not(#b-search) .hh{margin:0 -12px 10px;padding:9px 12px;background:var(--segh);cursor:pointer;user-select:none}
.blk:not(#b-search) .hh h2{color:var(--ink);font-size:12px}
.hh .cv{margin-left:auto;width:28px;height:28px;padding:0;min-height:0;background:transparent;color:var(--mute);font-size:14px}
.hh .cv:hover{color:var(--ink)}
.blk.closed:not(#b-search){padding-bottom:0}
.blk.closed>*:not(.hh){display:none!important}
.blk.closed:not(#b-search) .hh{margin-bottom:0}
.pc,.d22{background:var(--panel)}
@media(max-width:800px){
 body{display:flex;flex-direction:column;height:auto;overflow:visible}
 header{order:0;padding:8px 12px;gap:6px}
 h1{font-size:15px;white-space:normal}
 #banner{order:1;position:sticky;top:0;z-index:30;padding:6px 10px 8px}
 main{order:2;display:block}
 #left{display:none}
 aside{padding:8px 12px 24px;overflow:visible;border-left:0}
 .desk{display:none!important}
 #tools .tx{display:none}
 #tools{gap:6px}
 button{min-height:40px}
 #tools button{padding:6px 12px}
 #b-seats{display:none}
 #banner .bl{margin-bottom:4px}
 #banner .bl b{font-size:13.7px;padding:1px 9px}
 #banner .rs{width:14px;height:14px}
 #banner .br{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
 #banner .bbox{display:none}
 #banner .bblock{height:44px;padding:0 6px}
 #banner .bblock b{font-size:11px;padding:1px 5px}
 #banner .bblock em{font-size:28px}
 #banner .bpct{font-size:11px;margin-bottom:2px}
 #toasts{top:112px;bottom:auto;left:8px;right:8px;max-width:none}
 #b-det{scroll-margin-top:110px}
 .blk:not(#b-search){margin-bottom:10px}
 .hh .cv{min-height:0}
 #foot{order:3;padding:14px 12px 24px;background:var(--panel)}
 #foot #tools{justify-content:center;flex-wrap:wrap}
 #foot #tools .tx{display:inline}
 #foot #tools .ic{margin-right:6px}
}
#foot:empty{display:none}
#route{margin:2px 0 12px}
.rbar{position:relative;display:flex;height:16px;background:var(--bar);cursor:pointer}
.rbar i{flex:1 0 0;min-width:0;height:100%}
.rbar u{position:absolute;top:-4px;bottom:-4px;width:3px;background:#fff;box-shadow:0 0 0 1px #0007;pointer-events:none;transform:translateX(-1px)}
.rml{font-size:12px;color:var(--mute);margin-top:6px}
#ndlg{width:min(560px,94vw)}
.rk{border-top:1px solid var(--line);padding:9px 0;cursor:pointer}
.rk:hover{background:#7c5cff10}
.rk .rn{display:flex;justify-content:space-between;gap:8px}
.rk .rn span{color:var(--mute);font-size:12px}
.rk .no{font-style:normal;color:var(--mute);display:inline-block;min-width:30px}
.rk .rc{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.stack{position:relative}
.stack .mj{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;transform:translateX(-1px)}
#ndb{max-height:70vh;overflow:auto}
#ndb .pv{padding:8px 0}
.pb{display:grid;grid-template-columns:72px 1fr 44px;gap:8px;align-items:center;margin:6px 0}
.pb b{text-align:right;font-size:13px}
#filters button[hidden]{display:none}
</style></head><body>
<header><div class="hl"><h1>Soirée électorale · Québec 2026</h1><span id="status">Chargement…</span></div>
<div id="tools"><span id="upd" class="desk"></span><button id="rf" aria-label="Actualiser"><span class="ic">↻</span><span class="tx">Actualiser</span></button><button id="dm">Mode démo</button><button id="tm" aria-label="Changer de thème">☾</button><button id="al"></button><button id="bn" class="desk">Bandeau seul ↗</button></div></header>
<main>
<section id="left">
<div id="bar">
<div id="zones"><button data-z="prov" class="on">Québec (province)</button><button data-z="sud">Sud du Québec</button><button data-z="mtl">Montréal</button><button data-z="lrs">Laval / Rive-Sud</button><button data-z="qc">Ville de Québec</button><button data-z="gat">Gatineau</button><button data-z="sher">Sherbrooke</button></div>
<div id="rbar"><div id="seg"><nav id="tabs"><button data-v="live" class="on">2026</button><button data-v="2022">2022</button><button data-v="2018">2018</button></nav><button id="sbs" aria-pressed="false">Côte à côte</button></div>
<button id="pb" aria-pressed="false">✏️ Crayon</button><label id="pf" hidden><input type="checkbox" id="pfade" checked> S'efface après 5 s</label><button id="pc" hidden>Tout effacer</button></div>
</div>
<div id="map"><div id="maps"><div class="mp"><div class="cap" id="cap1" hidden>2026 · en direct</div><svg id="svg" role="img" aria-label="Carte des circonscriptions"></svg></div><div class="mp" id="mp2" hidden><div class="cap">2022 · résultats finaux</div><svg id="svg2" role="img" aria-label="Carte 2022"></svg></div></div>
<canvas id="pen"></canvas>
<div id="mosaic" hidden></div>
<div id="zoom"><button id="zi" aria-label="Zoom avant">+</button><button id="zo" aria-label="Zoom arrière">−</button><button id="zr" aria-label="Réinitialiser" style="font-size:14px">⟲</button></div>
<div id="legend"><span><i style="background:#1fb5ec"></i>CAQ</span><span><i style="background:#e3263b"></i>PLQ</span><span><i style="background:#2b62d9"></i>PQ</span><span><i style="background:#8c45c8"></i>PCQ</span><span><i style="background:#fb6d1c"></i>QS</span><span><i style="background:#8a93a0"></i>Autres</span><span><i style="background:var(--none)"></i>Aucun résultat</span><span>Teinte pâle = course serrée</span></div></div>
</section>
<aside>

<script>
// ====== CONFIGURATION ======
const BASE="https://donnees.electionsquebec.qc.ca";
const HIST={ // URLs des archives (dgeq.org/archives.html). La carte de 2022/2018 diffère de celle de 2026 → fournir le GeoJSON d'époque.
  live:{geo:"data/carte2026.geojson",res:BASE+"/production/provincial/resultats/resultats.json"},
  2022:{geo:"data/carte2022.geojson",res:"data/resultats2022.json"}, // fichiers locaux (évite CORS)
  2018:{geo:"data/carte2018.geojson",res:"data/resultats2018.json"}
};
const PROXY=new URLSearchParams(location.search).get("proxy")||(window.APP_CONFIG&&window.APP_CONFIG.proxy)||"api/resultats"; // fonction Netlify (netlify/functions/resultats.js). Version autonome: ?proxy=https://votre-site.netlify.app/api/resultats
const REFRESH_MS=(+new URLSearchParams(location.search).get("refresh")||30)*1000, SOLID_PTS=20;
const DGEQ_CAND=BASE+"/production/provincial/candidatures/candidatures.json";
const QD={pivot:"course ouverte",enclin:"avantage mince",probable:"avantage net",solide:"avantage large"};
const TIERS=[{k:"Pivots",max:5,d:"écart < 5 pts"},{k:"Enclins",max:10,d:"5 à 10 pts"},{k:"Probables",max:20,d:"10 à 20 pts"},{k:"Solides",max:Infinity,d:"20 pts et plus"}];
const DEMO=new URLSearchParams(location.search).has("demo");
const PARTIES={CAQ:{n:"CAQ",c:"#1fb5ec"},PLQ:{n:"PLQ",c:"#e3263b"},PQ:{n:"PQ",c:"#2b62d9"},PCQ:{n:"PCQ",c:"#8c45c8"},QS:{n:"QS",c:"#fb6d1c"}};
// ====== ADAPTATEUR (format réel du DGEQ, validé sur resultats.json 2022) ======
// Retourne { code: {nom, pct, cands:[{n,p,v}]} } ; pct = % de bureaux dépouillés (100 = terminé)
function adapt(j,final){
  const out={};
  (j.circonscriptions||[]).forEach(c=>{
    const done=final||c.isResultatsFinaux||(c.nbBureauTotal&&c.nbBureauComplete>=c.nbBureauTotal);
    out[String(c.numeroCirconscription)]={nom:c.nomCirconscription,
      pct:done?100:(c.nbBureauTotal?c.nbBureauComplete/c.nbBureauTotal*100:0),ins:+c.nbElecteurInscrit||0,exe:+c.nbVoteExerce||0,
      cands:(c.candidats||[]).map(x=>({n:`${x.prenom||""} ${x.nom||""}`.trim(),p:partyKey(x.abreviationPartiPolitique,x.numeroPartiPolitique),a:x.abreviationPartiPolitique,v:+x.nbVoteTotal||0}))};
  });
  return out;
}
const PNUM={27:"CAQ",6:"PLQ",8:"PQ",40:"QS",22:"PCQ"}; // numéros du registre des partis (identiques en 2018, 2022 et 2026)
function partyKey(s,n){
  if(n!==undefined&&n!==null&&n!==""&&!isNaN(+n))return PNUM[+n]||"AUTRE";
  const t=(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.\s]/g,"").toUpperCase();
  if(/CAQ/.test(t))return"CAQ";if(/PLQ|QLP/.test(t))return"PLQ";if(/^PQ/.test(t))return"PQ";if(/^QS/.test(t))return"QS";
  if(/^PCQ|^PCOQ/.test(t))return"PCQ";return"AUTRE"}
// ====== ÉTAT ======
const SEL=new Set();
const $=id=>document.getElementById(id), svg=$("svg"), svg2=$("svg2"), tip=$("tip");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let view="live",feats=[],results={},paths={},names={},geoLoaded=null,timer=null,base,vb,dragging=false;
const pick=(o,re)=>{const k=Object.keys(o).find(k=>re.test(k));return k?o[k]:undefined};
const geoCode=f=>String(pick(f.properties,/^(co_|code|num)/i)??f.id);
const geoName=f=>pick(f.properties,/^(nm_|nom)/i)||"Circonscription "+geoCode(f);
const rings=g=>g.type==="Polygon"?[g.coordinates]:g.coordinates;
const rank=r=>r&&r.cands.filter(c=>c.v>0).sort((a,b)=>b.v-a.v);
const info=code=>infoOf(results,code);
function infoOf(res,code){ // leader, écart en points, statut
  const r=res[code],s=rank(r);if(!s||!s.length)return null;
  const tot=r.cands.reduce((a,c)=>a+c.v,0),gap=((s[0].v-(s[1]?s[1].v:0))/tot)*100;
  return{r,s,tot,lead:s[0],second:s[1],gap,won:r.pct>=100};
}
// ====== MODÈLE EN DIRECT (simulations Monte Carlo + seuils de probabilité de victoire) ======
// Solide > 99,5 % · Probable 90–99,5 % · Enclin 70–90 % · Pivot < 70 %
const MC={N:2000,SIGMA:.05,MINF:.05,SOLIDE:99.5,PROBABLE:90,ENCLIN:70,PIVOT_MIN:15};
let CLS={};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const tierOfProb=p=>p>=MC.SOLIDE?"solide":p>=MC.PROBABLE?"probable":p>=MC.ENCLIN?"enclin":"pivot";
const WPC={};
function winProb(c){ // les simulations ne sont refaites que si les votes de la circonscription ont changé
  const r=results[c];if(!r)return null;
  const sig=Math.round(r.pct*10)+":"+r.cands.map(x=>x.p+x.v).join(",");
  if(WPC[c]&&WPC[c].sig===sig)return WPC[c].val;
  const val=winProbRaw(c);WPC[c]={sig,val};return val;
}
function winProbRaw(c){
  const r=results[c];if(!r)return null;
  const cs=r.cands.filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,5),V=cs.reduce((a,x)=>a+x.v,0),f=r.pct/100;
  if(!V||f<MC.MINF)return null;
  const w=cs.map(()=>0);
  if(f>=1)w[0]=1;
  else{ // votes restants R ~ V(1-f)/f, parts restantes = parts actuelles + bruit gaussien (SIGMA)
    const R=V*(1-f)/f,rand=rng((+c||0)*7919+V),g=()=>Math.sqrt(-2*Math.log(rand()||1e-9))*Math.cos(2*Math.PI*rand());
    for(let k=0;k<MC.N;k++){
      const sh=cs.map(x=>Math.max(1e-4,x.v/V+g()*MC.SIGMA)),S=sh.reduce((a,b)=>a+b,0);
      let b=-1,bi=0;cs.forEach((x,j)=>{const t=x.v+R*sh[j]/S;if(t>b){b=t;bi=j}});w[bi]++;
    }
    w.forEach((x,j)=>w[j]=x/MC.N);
  }
  const probs={};cs.forEach((x,j)=>probs[x.p]=(probs[x.p]||0)+w[j]*100);
  const ranked=Object.entries(probs).sort((a,b)=>b[1]-a[1]),P=ranked[0][1],tier=tierOfProb(P);
  const parties=tier==="pivot"?ranked.filter(e=>e[1]>=MC.PIVOT_MIN).map(e=>e[0]).join("/"):ranked[0][0];
  return{tier,parties,probs,p:P};
}
function classify(){
  CLS={};if(view!=="live")return;
  Object.keys(paths).forEach(c=>{const m=winProb(c);if(m)CLS[c]={tier:m.tier,parties:m.parties,src:"live",probs:m.probs,p:m.p}});
}
// ====== CARTE ======
function draw(){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  feats.forEach(f=>rings(f.geometry).forEach(p=>p[0].forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)})));
  const k=Math.cos(((y0+y1)/2)*Math.PI/180);
  proj={x0,y1,k};
  base={x:0,y:0,w:(x1-x0)*k,h:y1-y0};vb={...base};applyVB();
  svg.innerHTML="";paths={};SELC=null;glowKey="";
  feats.forEach(f=>{
    const code=geoCode(f);
    const d=rings(f.geometry).map(p=>p.map(r=>"M"+r.map(([x,y])=>((x-x0)*k).toFixed(4)+","+(y1-y).toFixed(4)).join("L")+"Z").join("")).join("");
    const el=document.createElementNS("http://www.w3.org/2000/svg","path");
    el.setAttribute("d",d);names[code]=geoName(f);
    el.onmousemove=e=>!dragging&&showTip(e,code,geoName(f));el.onmouseleave=()=>tip.style.display="none";
    el.onclick=()=>{if(!dragging)selectRiding(code)};
    svg.appendChild(el);paths[code]=el;
  });
  if(SIDE)drawSide();
}
let vbQ=0,svgW=1000,svgH=700,mvT=0;
function applyVB(){ // une seule mise à jour par image (le déplacement envoie plusieurs événements par image)
  svg.classList.add("moving");clearTimeout(mvT);mvT=setTimeout(()=>svg.classList.remove("moving"),200);
  if(vbQ)return;
  vbQ=requestAnimationFrame(()=>{vbQ=0;if(!vb)return;
    const v=`${vb.x} ${vb.y} ${vb.w} ${vb.h}`;svg.setAttribute("viewBox",v);svg2.setAttribute("viewBox",v);
    const u=1/Math.min(svgW/vb.w,svgH/vb.h);svg.style.setProperty("--u",u);svg2.style.setProperty("--u",u)})
}
new ResizeObserver(()=>{const r=svg.getBoundingClientRect();if(r.width){svgW=r.width;svgH=r.height;applyVB()}}).observe(svg);
function zoomAt(f,cx,cy){
  const nw=Math.min(base.w,Math.max(base.w/25,vb.w*f)),r=nw/vb.w,nh=vb.h*r;
  vb={x:cx-(cx-vb.x)*r,y:cy-(cy-vb.y)*r,w:nw,h:nh};applyVB();
}
function bindPan(el){
  const pt=e=>{const p=el.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(el.getScreenCTM().inverse())};
  el.addEventListener("wheel",e=>{e.preventDefault();const p=pt(e);zoomAt(e.deltaY<0?.8:1.25,p.x,p.y)},{passive:false});
  el.addEventListener("pointerdown",e=>{dragging=false;el._d=true;el._pid=e.pointerId;el._sx=e.clientX;el._sy=e.clientY});
  el.addEventListener("pointermove",e=>{
    if(!el._d)return;if(!e.buttons){el._d=false;return}
    if(!dragging){if(Math.hypot(e.clientX-el._sx,e.clientY-el._sy)<4)return;dragging=true;el.setPointerCapture(el._pid)}
    tip.style.display="none";el.classList.add("drag");
    const sc=el.getScreenCTM().a;vb.x-=e.movementX/sc;vb.y-=e.movementY/sc;applyVB()});
  el.addEventListener("pointerup",()=>{el._d=false;el.classList.remove("drag");setTimeout(()=>dragging=false,0)});
}
bindPan(svg);bindPan(svg2);
const mid=()=>[vb.x+vb.w/2,vb.y+vb.h/2];
$("zi").onclick=()=>zoomAt(.6,...mid());$("zo").onclick=()=>zoomAt(1.6,...mid());$("zr").onclick=()=>{vb={...base};applyVB();zoneOn("prov")};
// ====== RENDU ======
let SIGK=null,paintQ=0;
function resultsSig(){let h=0,n=0;for(const c in results){const r=results[c];n++;h=(Math.imul(h,31)+Math.round(r.pct*10))|0;for(const x of r.cands)h=(Math.imul(h,31)+x.v)|0}return n+":"+h}
function uiSig(){return [view,FEED,[...SEL].join(),WACT,WGLOW,WDIM,WMOS,WCUSTOM&&WACT?JSON.stringify(WCUSTOM[WACT]):"",ALERT,SIDE,geoLoaded,Object.keys(paths).length,Object.keys(prev).length,prevTried,resTried].join("|")}
function paint(){ // regroupe les appels et ne redessine que si les données ou l'interface ont changé
  if(paintQ)return;
  paintQ=setTimeout(()=>{paintQ=0;const k=resultsSig()+"#"+uiSig();if(k===SIGK)return;SIGK=k;paintNow()},0);
}
function paintNow(){
  const TOTAL=Object.keys(paths).length,MAJ=Math.floor(TOTAL/2)+1;
  classify();
  if(view==="live"&&!DEFW)DEFW=defaultWatch();
  WSET=new Set(WACT&&view==="live"?watchOf(WACT):[]);
  const won={},lead={};Object.keys(PARTIES).forEach(p=>{won[p]=0;lead[p]=0});
  Object.entries(paths).forEach(([c,el])=>{
    const i=info(c);
    el.style.opacity=(view==="live"&&SEL.size&&!(CLS[c]&&SEL.has(CLS[c].tier)))||(WDIM&&WACT&&view==="live"&&!WSET.has(c))?.12:1; // filtre niveaux
    if(!i){el.style.fill="var(--none)";el.style.fillOpacity=1;return}
    el.style.fill=PARTIES[i.lead.p]?.c||"#8a93a0";
    el.style.fillOpacity=(.3+.7*Math.min(1,i.gap/SOLID_PTS)).toFixed(2); // course serrée = plus pâle
    if(PARTIES[i.lead.p])(i.won?won:lead)[i.lead.p]++;
  });
  const W=Object.values(won).reduce((a,b)=>a+b,0),L=Object.values(lead).reduce((a,b)=>a+b,0),none=W+L===0;
  ST.maj=MAJ;ST.total=TOTAL;
  $("sub").textContent=`${W} gagnées · ${L} en avance · majorité ${MAJ}`;
  const ent=Object.entries(PARTIES);
  $("parties").innerHTML=ent.map(([k,p])=>{
    const t=won[k]+lead[k],dl=t-(S22[k]||0),d=none||view!=="live"?"—":(dl>0?"+":dl<0?"−":"±")+Math.abs(dl);
    return `<div class="pc" style="--c:${p.c}"><b>${k}</b><span class="n">${t}</span><span class="d">${d}</span></div>`}).join("")
   +`<div class="sbar">${ent.map(([k,p])=>`<i style="width:${won[k]/TOTAL*100}%;background:${p.c}"></i><i style="width:${lead[k]/TOTAL*100}%;background:${p.c};opacity:.4"></i>`).join("")}<u style="left:${MAJ/TOTAL*100}%"></u></div>`;
  renderBanner(won,lead,TOTAL,MAJ,W+L);paintSide();renderChanges();renderDet();checkAlerts(won,lead,TOTAL,MAJ);renderWatch();renderRegions();
  const Q=view==="live",IDX={pivot:0,enclin:1,probable:2,solide:3};
  const tiers=TIERS.map(t=>({...t,items:[]}));
  const nameOf=c=>results[c]?.nom||names[c]||c;
  const dot=p=>`<span class="dot" style="background:${PARTIES[p]?.c||"#8a93a0"}"></span>`;
  const lbl=(t,p)=>t==="pivot"?"Pivot "+p:p+" "+t;
  if(Q){
    tiers.forEach((t,n)=>t.d=QD[Object.keys(IDX)[n]]);
    Object.keys(paths).forEach(c=>{const k=CLS[c];if(k)tiers[IDX[k.tier]].items.push({c,i:info(c),q:[k.tier,k.parties],k})});
    tiers.forEach(t=>t.items.sort((a,b)=>((a.i?a.i.gap:99)-(b.i?b.i.gap:99))||nameOf(a.c).localeCompare(nameOf(b.c),"fr")));
  }else{
    Object.keys(paths).forEach(c=>{const i=info(c);if(i)tiers.find(t=>i.gap<t.max).items.push({c,i});});
    tiers.forEach(t=>t.items.sort((a,b)=>a.i.gap-b.i.gap));
  }
  const all=tiers.flatMap(t=>t.items),nWait=Object.keys(paths).length-all.length;
  if(Q)document.querySelectorAll("#filters [data-t]").forEach(b=>{const n=b.querySelector("small");if(n)n.textContent=all.filter(x=>x.k.tier===b.dataset.t).length});
  $("th").textContent=Q?"Niveaux de course":"Courses par niveau";
  $("psub").textContent=Q?`${all.length} classée(s) · ${nWait} en attente de résultats`:`${all.length} avec résultats`;
  // barre de couleurs (sièges par parti, du plus sûr au plus ouvert) + une ligne cliquable par niveau
  const TKEYS=Object.keys(IDX);TD={};
  tiers.forEach((t,n)=>TD[TKEYS[n]]={t,n,items:t.items});
  const tcol=p=>PARTIES[p]?.c||"#8a93a0";
  const gcol=ps=>{const a=ps.split("/").map(tcol);return a.length>1?`repeating-linear-gradient(135deg,${a[0]} 0 3px,${a[1]} 3px 6px)`:a[0]};
  const classified=new Set(all.map(x=>x.c)),byParty={};
  tiers.forEach((t,n)=>{if(n===0)return;t.items.forEach(x=>{const p=x.q?x.q[1]:x.i.lead.p;(byParty[p]=byParty[p]||[]).push({c:x.c,n})})});
  ROUTE=[];
  Object.keys(byParty).sort((a,b)=>byParty[b].length-byParty[a].length).forEach(p=>byParty[p].sort((a,b)=>b.n-a.n).forEach(x=>ROUTE.push({c:x.c,p,n:x.n})));
  tiers[0].items.forEach(x=>ROUTE.push({c:x.c,p:x.q?x.q[1]:x.i.lead.p,n:0}));
  Object.keys(paths).filter(c=>!classified.has(c)).forEach(c=>ROUTE.push({c,p:null,n:-1}));
  $("route").innerHTML=`<div class="rbar">${ROUTE.map(r=>`<i style="background:${r.p?(r.n===0?gcol(r.p):tcol(r.p)):"var(--none)"}${r.n>0?`;opacity:${[0,.6,.8,1][r.n]}`:""}"></i>`).join("")}<u style="left:${MAJ/TOTAL*100}%"></u></div><div class="rml">Majorité : ${MAJ} sièges sur ${TOTAL}</div>`;
  $("tiers").innerHTML=tiers.filter(t=>!Q||!SEL.size||SEL.has(TKEYS[tiers.indexOf(t)])).map(t=>{
    const n=tiers.indexOf(t),cnt={};
    t.items.forEach(({i,q})=>{ // pivots: on compte les partis en lice (au lieu de chaque combinaison)
      const ps=(Q&&n===0&&q)?q[1].split("/"):[q?q[1]:i.lead.p];ps.forEach(kk=>cnt[kk]=(cnt[kk]||0)+1)});
    const ks=Object.entries(cnt).sort((a,b)=>b[1]-a[1]),tot=ks.reduce((a,e)=>a+e[1],0)||1;
    const stack=ks.map(([kk,v])=>`<i title="${kk} ${v}" style="width:${v/tot*100}%;background:${gcol(kk)}"></i>`).join("");
    const chips=ks.map(([kk,v])=>`<em>${kk.split("/").map(dot).join("")}${kk} ${v}</em>`).join("");
    return `<div class="rg" data-k="${TKEYS[n]}"><div class="rn"><b>${t.k}</b><span>${t.items.length} · ${t.d}${Q&&n===0?" · partis en lice":""}</span></div><div class="stack">${stack}</div><div class="rc"><span>${chips||"Aucune"}</span></div></div>`}).join("");
  $("tiers").querySelectorAll(".rg").forEach(d=>d.onclick=()=>openTier(d.dataset.k));
  if($("ndlg").open)renderNdlg();
}
function showTip(e,code,name){
  const i=info(code);let h=`<b>${esc(results[code]?.nom||name)}</b>`;
  const w22=view==="live"&&prevW[nk(name)];if(w22)h+=`<div style="color:var(--mute)">2022 : ${dotH(w22.p)}${esc(w22.n)}</div>`;
  const kk=CLS[code];if(kk)h+=`<div style="color:var(--mute)">Probabilité : ${kk.tier==="pivot"?"Pivot "+kk.parties:kk.parties+" "+kk.tier}${kk.probs?" · "+Object.entries(kk.probs).filter(e=>e[1]>=1).sort((a,b)=>b[1]-a[1]).map(e=>e[0]+" "+Math.round(e[1])+" %").join(", "):""}</div>`;
  if(!i)h+=`<div style="color:var(--mute)">En attente des résultats</div>`;

  Object.keys(paths).forEach(c=>{const i=info(c);if(!i)return;cur[c]=i.lead.p;const p=prev[nk(names[c])];if(p&&p!==i.lead.p)flips.add(c)});

      if(won[p]+lead[p]>=MAJ&&!AL.majL[p])ev.push({k:"majL",p,n:won[p]+lead[p]});
      if(won[p]>=MAJ&&!AL.majW[p])ev.push({k:"majW",p,n:won[p]});});

 chg:["Changements en direct",()=>`Comparaison avec le vainqueur de 2022, par nom de circonscription (${ST.known} sur ${ST.n} sont comparables, car les limites ont changé en 2026).`],
 niv:["Niveaux de course",()=>(view==="live"?`À mesure que les votes entrent, la page simule 2 000 fins de dépouillement par circonscription et estime la probabilité de victoire du parti en tête. Solide : plus de 99,5 %. Probable : 90 à 99,5 %. Enclin : 70 à 90 %. Pivot : moins de 70 %. Une circonscription n'est classée qu'à partir de 5 % de bureaux dépouillés.`:`Classement selon l'écart entre les deux premiers : pivot sous 5 points, enclin de 5 à 10, probable de 10 à 20, solide à 20 et plus.`)+` La barre regroupe les circonscriptions par parti, des plus sûres aux plus ouvertes (couleur pleine = solide, plus pâle = probable puis enclin, hachurée = pivot, grise = en attente). Le trait blanc marque la majorité. Cliquez la barre pour voir une course, ou un niveau pour voir son classement.`],

 reg:["Régions",()=>`Participation estimée = votes exercés ÷ électeurs inscrits des bureaux dépouillés. Les barres montrent la part des votes par parti. Cliquez une région pour zoomer la carte (ordinateur).`]
